name: Bug
description: バグ報告
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      placeholder: 何が起きているか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 修正内容
      placeholder: Claude に修正してほしい内容
  - type: textarea
    id: docs
    attributes:
      label: 参照ドキュメント
  - type: textarea
    id: notes
    attributes:
      label: 注意点
